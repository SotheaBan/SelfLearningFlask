<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% extends "base.html" %}
    {% block title %}Home{% endblock %}
    {% block content %}
   <h1 class="text-blue-600 flex justify-center items-center text-2xl font-bold mt-2">
        My Favorite fruite 
   </h1>
   <form class="container" method="POST" style="max-width: 400px;">
    <div class="mb-3">
      <label for="username" class="form-label">Your Name</label>
      <input type="text" class="form-control" id="username" name="username" placeholder="Enter your name">
    </div>
  
    <div class="mb-3">
      <label for="fruit" class="form-label">Fruit</label>
      <input type="text" class="form-control" id="fruit" name="fruit" placeholder="Enter your favorite fruit">
    </div>
  
    <div class="mb-3">
      <label for="taste" class="form-label">Taste</label>
      <select class="form-select" id="taste" name="taste">
        <option selected>What is your taste?</option>
        <option value="Sour">Sour</option>
        <option value="Bitter">Bitter</option>
        <option value="Sweet">Sweet</option>
      </select>
    </div>
  
    <div class="mb-4">
      <label for="color" class="form-label">Color</label>
      <select class="form-select" id="color" name="color">
        <option selected>What is your color?</option>
        <option value="Green">Green</option>
        <option value="Blue">Blue</option>
        <option value="Red">Red</option>
        <option value="Pink">Pink</option>
        <option value="Black">Black</option>
      </select>
    </div>
  
    <div class="d-flex justify-content-center mt-4">
      <button type="submit" class="btn btn-primary px-4">Submit</button>
    </div>
  </form>
  
  {% endblock %}
  
</body>
</html>
