<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    {% extends "base.html" %}
    {% block title %}Home{% endblock %}
    {% block content %}
   <h1 class="text-blue-600 flex justify-center items-center text-2xl font-bold mt-2">
        My Favorite fruite 
   </h1>
   <form class="container mt-5" id="formfruite" method="POST" style="max-width: 400px;">
    <div class="mb-3">
      <label for="username" class="form-label">Your Name</label>
      <input type="text" class="form-control" id="username" name="username" placeholder="Enter your name">
    </div>
  
    <div class="mb-3">
      <label for="fruit" class="form-label">Fruit</label>
      <input type="text" class="form-control" id="fruit" name="fruit" placeholder="Enter your favorite fruit">
    </div>
  
    <div class="mb-3">
      <label for="taste" class="form-label">Taste</label>
      <select class="form-select" id="taste" name="taste">
        <option value="" selected disabled>What is your taste?</option>
        <option value="Sour">Sour</option>
        <option value="Bitter">Bitter</option>
        <option value="Sweet">Sweet</option>
      </select>
    </div>
  
    <div class="mb-3">
      <label for="color" class="form-label">Color</label>
      <select class="form-select" id="color" name="color">
        <option value="" selected disabled>What is your color?</option>
        <option value="Green">Green</option>
        <option value="Blue">Blue</option>
        <option value="Red">Red</option>
        <option value="Pink">Pink</option>
        <option value="Black">Black</option>
      </select>
    </div>
  
    <div class="d-flex justify-content-center mt-4 position-relative">
      <button id="submitBtn" type="submit" class="btn btn-primary px-4">Submit</button>
    
      <!-- Tooltip / Message -->
      <div id="hoverMessage" class="position-absolute bg-warning text-dark rounded px-3 py-2 mt-2" 
           style="display: none; top: 100%; left: 50%; transform: translateX(-50%); z-index: 10;">
        Are you sure?
      </div>
    </div>
    
  </form>

  

  <script>
    $("#username").on("blur", function () {
      const username = $(this).val();
      if (username ) {
        $.ajax({
          url: "/get_user_data",
          type: "POST",
          contentType: "application/json",
          data: JSON.stringify({ username }),
          success: function (data) {
            $("#fruit").val(data.fruit || "");
            $("#taste").val(data.taste || "");
            $("#color").val(data.color || "");
          }
        });
        
      }
      
    });
  </script>
    {% endblock %}
</body>
</html>
