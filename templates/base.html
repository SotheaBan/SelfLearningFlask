<!-- templates/layout.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}My App{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark" style="font-family: sans-serif;">

    <nav class="navbar navbar-expand-lg shadow-sm px-4 py-3">
      <div class="container-fluid d-flex justify-content-between align-items-center">
        <div class="d-flex gap-4">
            <a href="{{ url_for('home') }}" class="text-dark text-decoration-none hover-text-primary">Home</a>
            <a href="{{ url_for('favorites') }}" class="text-dark text-decoration-none hover-text-primary">Favorites</a>
            <a href="{{ url_for('about') }}" class="text-dark text-decoration-none hover-text-primary">About</a>
        </div>
        <form class="form-inline my-2 my-lg-0  d-flex align-items-center">
            <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search">
            <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
          </form>
      </div>
    </nav>
  
    <!-- ✅ Page Content -->
    <main class="p-4">
      {% block content %}{% endblock %}
    </main>
  
  </body>
  
</html>
