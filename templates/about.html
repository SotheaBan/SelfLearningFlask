<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aboutpage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script type="text/javascript" 
         src="{{ url_for('static', filename='helloworld.js') }}">
    </script>
    <script src="https://kit.fontawesome.com/15079d3149.js" crossorigin="anonymous"></script>
</head>
<body>

    {% extends "base.html" %}
    {% block title %}Home{% endblock %}
    {% block content %}
    
    <div class="container px-0">
        <div class="row align-items-center">
      
          <div class="col-md-4 text-center">
            <img src="{{ url_for('static', filename='images/fruite.png') }}" alt="Fruit Image" class="img-fluid mt-3" width="200">
          </div>
      
          <div class="col-md-8">
            <div class="row mb-3">
              <div class="col-1 d-flex align-items-center justify-content-center">
                <i class="fa-solid fa-house fa-lg"></i>
              </div>
              <div class="col">
                <h5 class="mb-0">Sothea Ban</h5>
              </div>
            </div>
      
            <div class="row mb-3">
              <div class="col-1 d-flex align-items-center justify-content-center">
                <i class="fa-solid fa-envelope fa-lg"></i>
              </div>
              <div class="col">
                <h6 class="mb-0">bansothea.morakot@gmail.com</h6>
              </div>
            </div>
      
            <div class="row">
              <div class="col-1 d-flex align-items-center justify-content-center">
                <i class="fa-solid fa-phone fa-lg"></i>
              </div>
              <div class="col">
                <h6 class="mb-0">01919385</h6>
              </div>
            </div>
            <div class="row">
                <div class="col-1 d-flex align-items-center justify-content-center">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </div>
                <div class="col">
                  <a class="mb-0" href="{{url_for('logout')}}">Logout</a>
                </div>
              </div>
          </div>
        
        </div>
      </div>
      

    {% endblock %}
</body>
</html>
